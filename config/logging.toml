version = 1
disable_existing_loggers = false

[formatters.simple]
format = "[%(asctime)s] [%(levelname)s] %(message)s"

[formatters.verbose]
format = "[%(levelname)s|%(module)s|L%(lineno)d] %(asctime)s: %(message)s"
datefmt = "%Y-%m-%dT%H:%M:%S%z"

[handlers.stderr]
class = "logging.StreamHandler"
level = "WARNING"
formatter = "simple"
stream = "ext://sys.stderr"

[handlers.file]
class = "logging.handlers.RotatingFileHandler"
level = "DEBUG"
formatter = "verbose" # Changed from 'detailed' to 'verbose'
filename = "logs/error.log"
maxBytes = 10485760
backupCount = 3

[loggers.root]
handlers = ["stderr", "file"] # Changed from 'stdout' to valid handlers
level = "DEBUG"