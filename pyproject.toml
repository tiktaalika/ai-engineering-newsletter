[project]
name = "ai-engineering-newsletter-v2"
version = "0.1.0"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "attrs>=26.1.0",
    "cattrs>=26.1.0",
    "httpx>=0.28.1",
    "rss-parser>=4.4.0",
    "typer>=0.27.0",
]


[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.1",
    "ty>=0.0.65",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsletter"]

[project.scripts]
newsletter = "newsletter.main:main"